name: Legacy ambitious-sky frontend (manual only)

# This is NOT the SellerDevelopment yellow-mushroom target.
# Retain manual access only for an operator who has restored the legacy target.
# No automatic push or pull request deployment may target this site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_SKY_0B6875500 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./app" # App source code path
          skip_app_build: true
          api_location: "" # Api source code path - optional
          output_location: "" # No build output directory for this static site
          ###### End of Repository/Build Configurations ######
