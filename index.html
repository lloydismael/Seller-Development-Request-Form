<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Development Request Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner"><div class="banner-inner"><h1 id="formTitle">Seller Development Request Form</h1></div></header>

  <main class="paper">
    <p class="required-note"><span class="req">*</span> Required</p>

    <form id="bookingForm" novalidate>
      <div id="questions"></div>
      <div class="actions"><button type="submit" id="submitBtn" class="btn primary">Submit</button></div>
    </form>

    <section id="thanks" hidden>
      <h2>Your booking request has been submitted.</h2>
      <p>Here is a summary of your response:</p>
      <table class="summary"><tbody id="summary"></tbody></table>
      <div class="actions">
        <button type="button" id="againBtn" class="btn primary">Submit another response</button>
        <button type="button" id="exportBtn" class="btn">Export bookings (CSV)</button>
      </div>
    </section>
  </main>

  <script src="form-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
