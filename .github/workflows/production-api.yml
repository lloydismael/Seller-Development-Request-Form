name: Test API and deploy production

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# Never interrupt an in-progress production deployment with a newer push.
concurrency:
  group: sellerdevelopment-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test API
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Test API
        working-directory: api
        run: npm test

  deploy:
    name: Deploy shared production API (main only)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check required OIDC repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable $name. Configure main-branch OIDC prerequisites described in README.md before deployment."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage allowlisted API package
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d "$RUNNER_TEMP/booking-api.XXXXXX")"
          cp api/host.json api/package.json api/package-lock.json "$staging/"
          cp -R api/src "$staging/src"
          echo "API_PACKAGE_PATH=$staging" >> "$GITHUB_ENV"
      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy existing Flex Consumption Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-booking-prod-8941
          package: ${{ env.API_PACKAGE_PATH }}
          sku: flexconsumption
          remote-build: true